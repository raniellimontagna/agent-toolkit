minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
blockExoticSubdeps: true
packages:
  - "packages/*"
overrides:
  vite: ^8.1.6
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7 ReDoS (high). Reaches only dev tooling (vitest > vite,
    # tinyglobby, fdir); no patched release exists yet. Remove once picomatch
    # 4.0.8 or later is published and resolvable.
    - GHSA-fc5q-39xc-vjpf
